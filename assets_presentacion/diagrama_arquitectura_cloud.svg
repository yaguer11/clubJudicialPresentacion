<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%">
  <defs>
    <!-- Filtros de sombra -->
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="124%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1b211b" flood-opacity="0.08" />
    </filter>
    <filter id="shadow-primary" x="-8%" y="-8%" width="120%" height="124%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.14" />
    </filter>
    <filter id="shadow-railway" x="-8%" y="-8%" width="120%" height="124%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0b0c0e" flood-opacity="0.18" />
    </filter>

    <!-- Marcadores de flechas -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0284C7" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#16A34A" />
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#C29A1D" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#7C3AED" />
    </marker>
  </defs>

  <style>
    .bg-canvas { fill: #FAF8F5; }
    .box-card { fill: #FFFFFF; rx: 12px; stroke-width: 1.5px; }
    .box-title { font-family: 'Outfit', sans-serif; font-size: 14.5px; font-weight: 700; fill: #FFFFFF; letter-spacing: 0.5px; }
    .box-sub { font-family: 'Outfit', sans-serif; font-size: 11px; font-weight: 400; fill: rgba(255,255,255,0.88); }
    
    .lbl-badge { font-family: 'Outfit', sans-serif; font-size: 10px; font-weight: 700; }
    .lbl-code { font-family: 'Fira Code', monospace; font-size: 11px; font-weight: 600; fill: #1B211B; }
    .lbl-desc { font-family: 'Outfit', sans-serif; font-size: 11.5px; fill: #4A564A; }
    .lbl-sec { font-family: 'Outfit', sans-serif; font-size: 10.5px; fill: #7A877A; }
    
    .divider { stroke: #ECE7DF; stroke-width: 1; }
    .flow-line { fill: none; stroke-width: 2.2; stroke-linecap: round; }
    .private-boundary { fill: #F0FDF4; stroke: #86EFAC; stroke-width: 1.8px; stroke-dasharray: 6 4; rx: 14px; }
  </style>

  <!-- Fondo Canvas -->
  <rect width="100%" height="100%" class="bg-canvas" rx="14" />
  <rect x="1" y="1" width="918" height="618" rx="14" fill="none" stroke="#E3DDD1" stroke-width="2" />

  <!-- ====================================================================== -->
  <!-- ZONA SUPERIOR: USUARIOS Y CLIENTES PÚBLICOS (INTERNET) -->
  <!-- ====================================================================== -->
  <g transform="translate(40, 25)" filter="url(#shadow)">
    <rect class="box-card" width="220" height="95" stroke="#1E3A5F" />
    <path d="M 0,0 L 220,0 L 220,34 L 0,34 Z" fill="#1E3A5F" rx="12" />
    <rect x="0" y="24" width="220" height="10" fill="#1E3A5F" />
    <text x="12" y="20" class="box-title" style="font-size:13px;">👥 Clientes Web &amp; Móviles</text>
    
    <g transform="translate(12, 50)">
      <text class="lbl-desc">● Socios, Invitados y Backoffice</text>
      <text x="0" y="18" class="lbl-desc">● Conexión segura <tspan font-weight="700" fill="#0284C7">HTTPS / TLS 1.3</tspan></text>
      <text x="0" y="34" class="lbl-sec">Navegadores modernos en cualquier dispositivo</text>
    </g>
  </g>

  <!-- ====================================================================== -->
  <!-- ZONA INTERNET / CDN: SERVICIOS EXTERNOS EN LA NUBE -->
  <!-- ====================================================================== -->
  <g transform="translate(640, 25)" filter="url(#shadow)">
    <rect class="box-card" width="240" height="95" stroke="#7C3AED" />
    <path d="M 0,0 L 240,0 L 240,34 L 0,34 Z" fill="#7C3AED" rx="12" />
    <rect x="0" y="24" width="240" height="10" fill="#7C3AED" />
    <text x="12" y="20" class="box-title" style="font-size:13px;">☁️ Servicios Externos Cloud</text>
    
    <g transform="translate(12, 50)">
      <text class="lbl-desc">● <tspan font-weight="700" fill="#3448C5">Cloudinary CDN:</tspan> Multimedia WebP</text>
      <text x="0" y="18" class="lbl-desc">● <tspan font-weight="700" fill="#009EE3">MercadoPago:</tspan> Checkout Pro &amp; IPN</text>
      <text x="0" y="34" class="lbl-desc">● <tspan font-weight="700" fill="#000000">Resend API:</tspan> Emails transaccionales</text>
    </g>
  </g>

  <!-- ====================================================================== -->
  <!-- INFRAESTRUCTURA RAILWAY PAAS (CONTENEDOR CENTRAL) -->
  <!-- ====================================================================== -->
  <g transform="translate(25, 145)" filter="url(#shadow-railway)">
    <!-- Marco contenedor Railway -->
    <rect width="870" height="305" rx="14" fill="#FFFFFF" stroke="#0B0C0E" stroke-width="2" />
    <path d="M 0,0 L 870,0 L 870,42 L 0,42 Z" fill="#0B0C0E" rx="14" />
    <rect x="0" y="30" width="870" height="12" fill="#0B0C0E" />
    <text x="18" y="24" class="box-title" style="font-size:15px; fill:#FFFFFF;">🚂 Plataforma PaaS Railway (Región Privada Unificada)</text>
    <text x="590" y="24" font-family="'Outfit', sans-serif" font-size="11px" font-weight="600" fill="#A1A1AA">Red Privada Virtual (VPC) &lt; 2ms Latencia</text>

    <!-- BLOQUE 1: FRONTEND SPA -->
    <g transform="translate(20, 60)" filter="url(#shadow)">
      <rect class="box-card" width="250" height="225" stroke="#C29A1D" />
      <path d="M 0,0 L 250,0 L 250,42 L 0,42 Z" fill="#C29A1D" rx="12" />
      <rect x="0" y="30" width="250" height="12" fill="#C29A1D" />
      <text x="14" y="23" class="box-title" style="font-size:13.5px;">Frontend SPA (Vite + React)</text>
      <text x="14" y="37" class="box-sub">Bundle optimizado en Edge CDN</text>

      <g transform="translate(14, 60)">
        <text class="lbl-code">Static Web Service</text>
        <text x="0" y="16" class="lbl-badge" fill="#C29A1D">● Vite 6 + Material UI + Router</text>
      </g>
      <line x1="14" y1="84" x2="236" y2="84" class="divider" />

      <g transform="translate(14, 102)">
        <text class="lbl-desc">✔ Minificación de assets y chunks</text>
        <text x="0" y="18" class="lbl-desc">✔ Certificado SSL/TLS con auto-renew</text>
        <text x="0" y="36" class="lbl-desc">✔ Compresión Gzip / Brotli</text>
        <text x="0" y="54" class="lbl-sec">Vite Build: salida estática en /dist</text>
      </g>
    </g>

    <!-- BLOQUE 2: BACKEND NODE.JS CONTENEDORIZADO -->
    <g transform="translate(305, 60)" filter="url(#shadow)">
      <rect class="box-card" width="265" height="225" stroke="#16A34A" />
      <path d="M 0,0 L 265,0 L 265,42 L 0,42 Z" fill="#16A34A" rx="12" />
      <rect x="0" y="30" width="265" height="12" fill="#16A34A" />
      <text x="14" y="23" class="box-title" style="font-size:13.5px;">Backend API (Node.js 20)</text>
      <text x="14" y="37" class="box-sub">Microservicio REST Express en contenedor</text>

      <g transform="translate(14, 60)">
        <text class="lbl-code">Docker / Nixpacks Runtime</text>
        <text x="0" y="16" class="lbl-badge" fill="#16A34A">● API RESTful + Webhooks IPN</text>
      </g>
      <line x1="14" y1="84" x2="251" y2="84" class="divider" />

      <g transform="translate(14, 102)">
        <text class="lbl-desc">✔ Variables de entorno cifradas</text>
        <text x="0" y="18" class="lbl-desc">✔ Auto-reinicio ante fallos (Zero Downtime)</text>
        <text x="0" y="36" class="lbl-desc">✔ Healthchecks HTTP /api/health</text>
        <text x="0" y="54" class="lbl-sec">JWT Secret, MercadoPago Token, Resend Key</text>
      </g>
    </g>

    <!-- BLOQUE 3: MYSQL 8.0 GESTIONADO -->
    <g transform="translate(600, 60)" filter="url(#shadow)">
      <rect class="box-card" width="250" height="225" stroke="#0284C7" />
      <path d="M 0,0 L 250,0 L 250,42 L 0,42 Z" fill="#0284C7" rx="12" />
      <rect x="0" y="30" width="250" height="12" fill="#0284C7" />
      <text x="14" y="23" class="box-title" style="font-size:13.5px;">MySQL 8.0 Gestionado</text>
      <text x="14" y="37" class="box-sub">Persistencia transaccional InnoDB</text>

      <g transform="translate(14, 60)">
        <text class="lbl-code">Private Networking (VPC)</text>
        <text x="0" y="16" class="lbl-badge" fill="#0284C7">● 37 Tablas Normalizadas 3FN</text>
      </g>
      <line x1="14" y1="84" x2="236" y2="84" class="divider" />

      <g transform="translate(14, 102)">
        <text class="lbl-desc">✔ Latencia de red ultra-baja (&lt; 2 ms)</text>
        <text x="0" y="18" class="lbl-desc">✔ Event Scheduler activo (60s)</text>
        <text x="0" y="36" class="lbl-desc">✔ Backups automáticos diarios</text>
        <text x="0" y="54" class="lbl-sec">Sin exposición a internet pública</text>
      </g>
    </g>

    <!-- Conexión interna Frontend -> Backend -->
    <path d="M 270,170 L 305,170" class="flow-line" stroke="#16A34A" marker-end="url(#arrow-green)" />
    <text x="272" y="162" font-family="'Fira Code', monospace" font-size="10px" font-weight="700" fill="#16A34A">/api/*</text>

    <!-- Conexión interna Backend -> MySQL (Red Privada) -->
    <path d="M 570,170 L 600,170" class="flow-line" stroke="#0284C7" marker-end="url(#arrow-blue)" />
    <g transform="translate(565, 192)">
      <rect x="-8" y="-12" width="50" height="16" rx="4" fill="#E0F2FE" />
      <text font-family="'Fira Code', monospace" font-size="9.5px" font-weight="700" fill="#0369A1">&lt; 2 ms</text>
    </g>

  </g>

  <!-- ====================================================================== -->
  <!-- CAJAS CALLOUTS INFERIORES: PILARES TÉCNICOS DE PRODUCCIÓN -->
  <!-- ====================================================================== -->

  <!-- Callout 1: Conectividad y Red Privada -->
  <g transform="translate(25, 465)" filter="url(#shadow)">
    <rect class="box-card" width="415" height="135" stroke="#1E3A5F" stroke-width="1.4" />
    <rect x="0" y="0" width="415" height="30" rx="8" fill="#1E3A5F" />
    <text x="12" y="20" class="box-title" style="font-size:12px;">Pilar 1: Red Privada y Rendimiento</text>
    
    <text x="12" y="48" class="lbl-desc" font-weight="700" fill="#1E3A5F">Latencia Interna &lt; 2ms y Cero Exposición Pública de DB</text>
    <text x="12" y="66" class="lbl-desc">✔ Backend y MySQL conviven en la misma Virtual Private Cloud (VPC) de</text>
    <text x="24" y="80" class="lbl-desc">Railway, eliminando saltos de internet y acelerando queries transaccionales.</text>
    <text x="12" y="96" class="lbl-desc">✔ MySQL solo escucha en host interno (railway.internal): puertos cerrados</text>
    <text x="24" y="110" class="lbl-desc">al exterior para máxima seguridad contra ataques de fuerza bruta.</text>
  </g>

  <!-- Callout 2: Seguridad y Gestión de Entorno -->
  <g transform="translate(460, 465)" filter="url(#shadow)">
    <rect class="box-card" width="435" height="135" stroke="#C29A1D" stroke-width="1.4" fill="#FFFDF5" />
    <rect x="0" y="0" width="435" height="30" rx="8" fill="#C29A1D" />
    <text x="12" y="20" class="box-title" style="font-size:12px;">Pilar 2: Certificados SSL y Variables Cifradas</text>
    
    <text x="12" y="48" class="lbl-desc" font-weight="700" fill="#8C6D07">Secret Management &amp; HTTPS Automático de Extremo a Extremo</text>
    <text x="12" y="66" class="lbl-desc">✔ Zero Hardcoding: secretos críticos (claves privadas JWT, MercadoPago</text>
    <text x="24" y="80" class="lbl-desc">Access Token, Cloudinary Secrets) residen cifrados en variables PaaS.</text>
    <text x="12" y="96" class="lbl-desc">✔ Certificados SSL/TLS gestionados con renovación automática: tráfico seguro</text>
    <text x="24" y="110" class="lbl-desc">en frontend, backend y pasarelas de pago sin costo operativo manual.</text>
  </g>

  <!-- ====================================================================== -->
  <!-- LÍNEAS DE FLUJO SUPERIORES -->
  <!-- ====================================================================== -->

  <!-- Clientes a Frontend SPA -->
  <path d="M 150,120 L 150,205" class="flow-line" stroke="#0284C7" marker-end="url(#arrow-blue)" />
  <g transform="translate(155, 135)">
    <text font-family="'Fira Code', monospace" font-size="10px" font-weight="700" fill="#0284C7">HTTPS</text>
  </g>

  <!-- Backend a Servicios Cloud Externos -->
  <path d="M 570,225 L 760,225 L 760,120" class="flow-line" stroke="#7C3AED" stroke-dasharray="4 3" marker-end="url(#arrow-purple)" />
  <g transform="translate(680, 215)">
    <text font-family="'Fira Code', monospace" font-size="10px" font-weight="700" fill="#7C3AED">APIs Externas</text>
  </g>

</svg>
